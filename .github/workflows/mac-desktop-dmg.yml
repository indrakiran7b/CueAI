name: Mac desktop DMG

on:
  workflow_dispatch:
  push:
    branches: [main, separation, build/macos-dmg-1.0.8]
    paths:
      - "repositories/cueai-desktop/macos/**"
      - "repositories/cueai-desktop/shared/**"
      - "repositories/cueai-web/**"
      - "repositories/cueai-desktop/scripts/dist-mac.cjs"
      - "repositories/cueai-desktop/scripts/prepare-desktop-web.cjs"
      - ".github/workflows/mac-desktop-dmg.yml"

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      AUTH_SECRET: cueai-ci-build-secret-not-for-production
      AUTH_URL: http://127.0.0.1:3002
      NEXT_PUBLIC_SKIP_AUTH: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            repositories/cueai-web/package-lock.json
            repositories/cueai-desktop/macos/package-lock.json

      - name: Install web + mac desktop deps
        run: |
          npm ci --prefix repositories/cueai-web
          npm ci --prefix repositories/cueai-desktop/macos

      - name: Write web env for production build
        run: |
          printf '%s\n' \
            'AUTH_SECRET=cueai-ci-build-secret-not-for-production' \
            'AUTH_URL=http://127.0.0.1:3002' \
            'NEXT_PUBLIC_SKIP_AUTH=false' \
            > repositories/cueai-web/.env.production

      - name: Build DMG
        run: node repositories/cueai-desktop/scripts/dist-mac.cjs

      - name: List release artifacts
        run: |
          ls -la repositories/cueai-desktop/macos/release/
          shasum -a 256 repositories/cueai-desktop/macos/release/*.dmg || true

      - name: Upload macOS DMG installers
        uses: actions/upload-artifact@v4
        with:
          name: cueai-mac-dmg-${{ github.run_number }}
          path: |
            repositories/cueai-desktop/macos/release/*.dmg
            repositories/cueai-desktop/macos/release/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cueai-macos-1.0.8-${{ github.run_number }}
          name: CueAI macOS 1.0.8 (build ${{ github.run_number }})
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            repositories/cueai-desktop/macos/release/*.dmg
            repositories/cueai-desktop/macos/release/*.zip
