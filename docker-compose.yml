services:
  postgres:
    image: postgres:16-alpine
    container_name: cueai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cueai}
      POSTGRES_USER: ${POSTGRES_USER:-cueai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cueai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cueai_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-cueai} -d ${POSTGRES_DB:-cueai}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: cueai-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  celery-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.worker
    container_name: cueai-celery-worker
    environment:
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      CUEAI_ENV: development
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: cueai-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/cueai-realm.json:/opt/keycloak/data/import/cueai-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

volumes:
  cueai_pg_data:
