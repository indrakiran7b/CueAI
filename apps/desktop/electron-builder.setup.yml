appId: com.cueai.desktop
productName: CueAI
executableName: CueAI
electronVersion: 37.10.3
directories:
  output: C:/cueai-dist
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
extraResources:
  - from: build-resources/web
    to: web
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: CueAI-Setup-${version}.${ext}
  executableName: CueAI
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CueAI
  uninstallDisplayName: CueAI
  artifactName: CueAI-Setup-${version}.${ext}
protocols:
  - name: CueAI
    schemes: [cueai]
